name: Deploy to Production

# Manual only. Production never deploys on push.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Requires one approval when a 'production' environment with required
    # reviewers exists in repo settings. Without one, this line is inert.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 1166339.us17.ssh.myftpupload.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync files (additive only, never deletes)
        run: |
          RSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          DEST="git_deployer_690ab25086_1166339@1166339.us17.ssh.myftpupload.com"

          rsync -rvz --checksum -e "$RSH" \
            wp-content/themes/srj-consulting/ \
            "$DEST:/html/wp-content/themes/srj-consulting/"

          rsync -vz --checksum -e "$RSH" \
            wp-content/mu-plugins/srj-*.php \
            "$DEST:/html/wp-content/mu-plugins/"

          rsync -vz --checksum -e "$RSH" \
            robots.txt llms.txt \
            "$DEST:/html/"

      - name: Verify sizes on server
        run: |
          RSH_CMD() { ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new git_deployer_690ab25086_1166339@1166339.us17.ssh.myftpupload.com "$@"; }

          fail=0
          check() {
            local rel="$1"
            local remote="/html/$1"
            local lsize rsize
            lsize=$(stat -c %s "$rel")
            rsize=$(RSH_CMD "stat -c %s '$remote' 2>/dev/null || echo MISSING")
            if [ "$rsize" = "MISSING" ]; then
              echo "MISSING  $rel"; fail=1
            elif [ "$lsize" != "$rsize" ]; then
              echo "MISMATCH $rel  local=$lsize remote=$rsize"; fail=1
            else
              echo "OK       $rel  ($lsize bytes)"
            fi
          }

          check wp-content/themes/srj-consulting/inc/ai-governance-config.php
          check wp-content/themes/srj-consulting/inc/helpers.php
          check wp-content/themes/srj-consulting/footer.php
          check wp-content/mu-plugins/srj-universal-template-router.php
          check robots.txt
          check llms.txt

          exit $fail
